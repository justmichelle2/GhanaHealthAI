<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem('gha-theme') || 'system'
          const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.themeMode = mode
        } catch { document.documentElement.dataset.theme = 'light' }
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ghana-health-mark.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8f5" />
    <meta name="description" content="Multilingual health information and clinician review for Ghana." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ghana Health" />
    <title>Ghana Health Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
